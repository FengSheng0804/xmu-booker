name: standalone-android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: chmod +x gradlew && ./gradlew :app:testProductionDebugUnitTest --console=plain
        working-directory: apps/mobile/android
  device-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd apps/mobile/android && chmod +x gradlew && ./gradlew :app:connectedProductionDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results-api-${{ matrix.api }}
          path: apps/mobile/build/app/outputs/androidTest-results/
  release-apk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, device-regression]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Prepare private release signing
        env:
          XMU_ANDROID_KEYSTORE_BASE64: ${{ secrets.XMU_ANDROID_KEYSTORE_BASE64 }}
          XMU_ANDROID_STORE_PASSWORD: ${{ secrets.XMU_ANDROID_STORE_PASSWORD }}
          XMU_ANDROID_KEY_ALIAS: ${{ secrets.XMU_ANDROID_KEY_ALIAS }}
          XMU_ANDROID_KEY_PASSWORD: ${{ secrets.XMU_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare-release-signing.py
      - name: Build signed release APK
        working-directory: apps/mobile
        run: flutter build apk --release --flavor production --target-platform android-arm64 --split-per-abi
      - name: Name and verify release artifact
        run: |
          mkdir -p release-artifacts
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk release-artifacts/xmu-booker-arm64-release.apk
          signer="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --verbose release-artifacts/xmu-booker-arm64-release.apk
          cd release-artifacts
          sha256sum xmu-booker-arm64-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: xmu-booker-arm64-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 -c 'import pathlib,re; text=pathlib.Path("apps/mobile/pubspec.yaml").read_text(encoding="utf-8"); match=re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?\+[0-9]+)\s*$", text, re.M); assert match, "Invalid app version"; print(match.group(1))')"
          tag="v${version/+/-build.}-${GITHUB_SHA:0:12}"
          title="场馆预约助手 ${version}"
          if gh release view "$tag" --json url >/dev/null 2>&1; then
            tagged_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')"
            test "$tagged_sha" = "$GITHUB_SHA" || { echo 'Release tag points to another commit'; exit 1; }
            gh release upload "$tag" release-artifacts/xmu-booker-arm64-release.apk release-artifacts/SHA256SUMS --clobber
          else
            gh release create "$tag" release-artifacts/xmu-booker-arm64-release.apk release-artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" --title "$title" --latest \
              --notes "通过源码检查及 Android 11/15 设备回归的正式签名 ARM64 APK。提交：$GITHUB_SHA。下载 xmu-booker-arm64-release.apk 安装；SHA256SUMS 用于校验文件。"
          fi
          release_url="$(gh release view "$tag" --json url --jq '.url')"
          printf '正式 APK 已发布：%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/prepare-release-signing.py --clean
